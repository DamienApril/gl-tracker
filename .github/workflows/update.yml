name: update
on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours
  workflow_dispatch:
concurrency: data  # one writer at a time, sync and update never race
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install curl_cffi beautifulsoup4 requests
      - run: python scraper/update.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: commit data
        run: |
          git config user.name "gl-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data update" && git pull --rebase && git push)
